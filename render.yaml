services:
  - type: web
    name: analista-ia-seguros
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install . && python data/generate_data.py
    startCommand: uvicorn analista_ia.web_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-flash-lite-latest
      - key: LLM_MAX_OUTPUT_TOKENS
        value: "600"
      - key: LIFETIME_QUESTION_LIMIT
        value: "4"
      - key: RATE_LIMIT_PER_MINUTE_IP
        value: "4"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "4"
      - key: GLOBAL_RPM_LIMIT
        value: "10"
      - key: DAILY_REQUEST_CAP
        value: "150"
      - key: QUOTA_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
