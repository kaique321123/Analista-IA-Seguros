[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analista-ia-seguros"
version = "0.1.0"
description = "Agente Text-to-SQL com camada semântica em YAML sobre DuckDB para análise de dados de seguros."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Kaique Santos", email = "kaique321123@users.noreply.github.com" }
]
dependencies = [
    "duckdb>=1.1.0",
    "pandas>=2.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.1",
    "sqlglot>=25.0.0",
    "python-dotenv>=1.0.1",
    "plotly>=5.22.0",
    "rich>=13.7.0",
    "streamlit>=1.38.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.6.0",
]
anthropic = ["anthropic>=0.34.0"]
openai = ["openai>=1.45.0"]
gemini = ["google-genai>=0.3.0"]
all-llms = [
    "anthropic>=0.34.0",
    "openai>=1.45.0",
    "google-genai>=0.3.0",
]

[project.scripts]
analista-ia = "analista_ia.cli:main"
analista-ia-web = "analista_ia.web_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py310"
